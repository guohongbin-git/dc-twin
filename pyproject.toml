[project]
name = "dc-twin"
version = "0.1.0"
description = "Evidence-grounded DC digital twin (open-source Warehouse-Blueprint-style scenario on agv-warehouse-core)"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
sim = ["mujoco>=3.0", "ortools>=9.8"]
render = ["Pillow>=10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
